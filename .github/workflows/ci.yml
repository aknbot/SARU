name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (Chromium)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check syntax
        run: |
          for f in app.js config.js courses.js exams.js sw.js courses/*/course.js courses/*/questions.js courses/*/datasets.js; do node --check "$f"; done
      - name: Smoke test
        run: node tests/smoke.mjs
